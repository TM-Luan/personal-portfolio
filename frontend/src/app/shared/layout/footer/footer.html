<footer class="footer">
  <div class="footer__container">
    <p class="footer__copyright">
      © 2026 Luan Tran. All rights reserved.
    </p>

    <div class="footer__socials">
      @if (githubUrl) {
          <a
            class="footer__social-link"
            [href]="githubUrl"
            target="_blank"
            rel="noopener noreferrer"
          >
            GitHub
          </a>
        } @else {
          <span class="footer__social-link footer__social-link--disabled">
            GitHub
          </span>
        }
      <!-- <span class="footer__link footer__link--disabled">
        GitHub
      </span> -->

      <span class="footer__separator">
        ·
      </span>

      <span class="footer__link footer__link--disabled">
        LinkedIn
      </span>
    </div>
  </div>
</footer>
